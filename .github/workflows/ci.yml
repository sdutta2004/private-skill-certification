name: CI/CD Pipeline — Private Skill Certification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate and Compile Compact Contract
        run: npm run compile:compact

      - name: Run Vitest Unit & E2E Tests
        run: npm test

      - name: Build Web Platform
        run: npm run build
